<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Pharmacy Operations by AYASYN General Tech Ltd. - B2B pharmacy inventory and sales prototype for GreenLife Pharmacy."
    />
    <title>Pharmacy Operations</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <div class="brand-block">
          <div class="brand-mark">GP</div>
          <div class="brand-copy">
            <div class="brand-name" id="sidebar-business-name">GreenLife Pharmacy</div>
            <div class="brand-subtitle">Pharmacy Operations</div>
          </div>
        </div>

        <nav class="nav" aria-label="Main navigation">
          <button class="nav-item active" data-page="overview" type="button">
            <span class="nav-icon">▣</span>
            <span>Overview</span>
          </button>
          <button class="nav-item" data-page="inventory" type="button">
            <span class="nav-icon">◫</span>
            <span>Inventory</span>
          </button>
          <button class="nav-item" data-page="pos" type="button">
            <span class="nav-icon">◬</span>
            <span>Sales / POS</span>
          </button>
          <button class="nav-item" data-page="transactions" type="button">
            <span class="nav-icon">◭</span>
            <span>Transactions</span>
          </button>
          <button class="nav-item" data-page="settings" type="button">
            <span class="nav-icon">⚙</span>
            <span>Settings</span>
          </button>
        </nav>

        <div class="sidebar-footer">
          <div class="powered-by">Powered by AYASYN</div>
          <div class="ayasyn-name">AYASYN General Tech Ltd.</div>
        </div>
      </aside>

      <div class="main-panel">
        <header class="topbar">
          <div class="topbar-left">
            <button class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="Toggle navigation">☰</button>
            <div class="header-business-name" id="header-business-name">GreenLife Pharmacy</div>
          </div>

          <div class="topbar-actions">
            <div class="prototype-chip">Prototype — Demo Data</div>
            <button class="icon-button" type="button" aria-label="Notifications">🔔</button>
            <div class="profile-menu" aria-label="User profile">
              <span class="profile-avatar">GM</span>
              <span class="profile-name">Admin</span>
            </div>
          </div>
        </header>

        <main class="content" id="app-content"></main>
      </div>
    </div>

    <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="true"></div>
    <div id="modal-root"></div>

    <script src="app.js"></script>
  </body>
</html>
